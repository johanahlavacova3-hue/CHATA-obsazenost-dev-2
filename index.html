<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsazenost chaty</title>
  <meta name="description" content="Kalendář obsazenosti chaty – volné a obsazené termíny.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="hlavicka">
    <div class="obal">
      <div class="hlavicka__spolek" id="spolek"></div>
      <h1 class="hlavicka__nadpis">Obsazenost chaty</h1>
    </div>
  </header>

  <main class="obal obsah">
    <nav class="navigace" aria-label="Výběr měsíce">
      <button class="tlacitko" id="predchozi" type="button" aria-label="Předchozí měsíc">‹</button>
      <div class="navigace__vyber">
        <label class="skryte" for="vyberMesic">Měsíc</label>
        <select id="vyberMesic" class="vyber vyber--mesic"></select>
        <label class="skryte" for="vyberRok">Rok</label>
        <select id="vyberRok" class="vyber vyber--rok"></select>
      </div>
      <button class="tlacitko" id="dnes" type="button">Dnes</button>
      <button class="tlacitko" id="dalsi" type="button" aria-label="Další měsíc">›</button>
    </nav>

    <div class="kalendar" role="grid" aria-labelledby="vyberMesic">
      <div class="kalendar__dny" role="row">
        <div role="columnheader">Po</div><div role="columnheader">Út</div><div role="columnheader">St</div>
        <div role="columnheader">Čt</div><div role="columnheader">Pá</div><div role="columnheader">So</div>
        <div role="columnheader">Ne</div>
      </div>
      <div class="kalendar__mrizka" id="mrizka" aria-live="polite"></div>
    </div>

    <ul class="legenda">
      <li><i class="legenda__barva legenda__barva--volno"></i>volno</li>
      <li><i class="legenda__barva legenda__barva--obsazeno"></i>obsazeno</li>
      <li><i class="legenda__barva legenda__barva--dnes"></i>dnes</li>
      <li><i class="legenda__barva legenda__barva--minule"></i>uplynulé dny</li>
    </ul>

    <p class="hlaska skryt" id="chyba" role="status"></p>
    <p class="stav" id="stav"></p>
  </main>

  <!-- pořadí je důležité: nastavení → data → kalendář → aplikace -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/kalendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
