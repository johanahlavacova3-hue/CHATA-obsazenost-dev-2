<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka se připravuje – Poutníci</title>
  <!-- ============ PÍSMA GAMAY + CHEESECAKE (Adobe Fonts) ============
       1) fonts.adobe.com → Gamay → „Add to Web Project“ (zaškrtni i Variable)
          + do STEJNÉHO projektu přidej Cheesecake (Mark Simonson) – logo „Poutníci“ a velké číslo odpočtu
       2) ID projektu (např. abc1def) vlož níže do ADOBE_KIT (ve všech .html)
       Dokud je prázdné, použije se náhradní Archivo a Lobster z Google Fonts. -->
  <script>
    (function () {
      var ADOBE_KIT = 'msh8cqt';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = ADOBE_KIT
        ? 'https://use.typekit.net/' + ADOBE_KIT + '.css'
        : 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Lobster&display=swap';
      document.head.appendChild(l);
      if (ADOBE_KIT) {
        var lob = document.createElement('link');
        lob.rel = 'stylesheet';
        lob.href = 'https://fonts.googleapis.com/css2?family=Lobster&display=swap';
        document.head.appendChild(lob);
      }
      document.documentElement.classList.add('js');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="hlavicka">
    <a class="logo" href="index.html" aria-label="Poutníci – chata">Poutníci</a>
    <button class="menu-tl" type="button" aria-expanded="false" aria-controls="menu">
      <span class="skryte">Menu</span><span class="menu-tl__car" aria-hidden="true"></span>
    </button>
    <nav class="menu" id="menu" aria-label="Hlavní menu">
      <a class="menu__o-nas" href="404.html">O nás</a>
      <a class="menu__akce" href="404.html">Akce</a>
      <a class="menu__oddil" href="404.html">Oddíl</a>
      <a class="menu__minitabor" href="minitabor.html">Minitábor</a>
      <a class="menu__plechovky" href="404.html">Plechovky</a>
      <a class="menu__chata" href="index.html">Chata</a>
      <a class="menu__fotky" href="404.html">Fotky</a>
    </nav>
  </header>

  <main class="chyba404">
    <h1 class="nadpis">Tady ještě nic není</h1>
    <p class="odstavec">Tahle část webu se teprve staví – jako naše chata. Zatím se můžete podívat, jak chata vypadá a kdy je volná.</p>
    <a class="pilulka" href="index.html">Zpět na chatu</a>
    <div class="chyba404__pila" aria-hidden="true"><img src="assets/img/ikony/pila.svg" alt=""></div>
  </main>

  <style>
    .chyba404 { position: relative; min-height: calc(100vh - var(--vyska-hlavicky)); padding: 40px 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 28px; overflow: hidden; }
    .chyba404 > * { position: relative; z-index: 1; }
    .chyba404 .nadpis { max-width: 10em; }
    /* velká nakloněná pila – řeže */
    .chyba404__pila { position: absolute !important; z-index: 0 !important; right: -4vw; bottom: 6%; width: min(62vw, 980px); rotate: -14deg; opacity: .95; pointer-events: none; }
    .chyba404__pila img { display: block; width: 100%; }
    @media (prefers-reduced-motion: no-preference) {
      .chyba404__pila img { animation: rezani 1.1s ease-in-out infinite; }
      @keyframes rezani { 0%, 100% { translate: -3% 0; } 50% { translate: 3% 0; } }
    }
    @media (max-width: 699px) { .chyba404__pila { width: 92vw; right: -18vw; bottom: 4%; opacity: .2; } }
    @media (min-width: 1100px) {
      .chyba404 { padding: calc(60 * var(--u)) calc(42 * var(--u)); gap: calc(60 * var(--u)); }
      .chyba404 .nadpis, .chyba404 .odstavec { position: relative; left: auto; top: auto; }
      .chyba404 .pilulka { height: calc(39 * var(--u)); padding: 0 calc(36 * var(--u)); font-size: calc(15 * var(--u)); border-radius: calc(10 * var(--u)); }
    }
  </style>
  <script src="assets/js/efekty.js"></script>
</body>
</html>
