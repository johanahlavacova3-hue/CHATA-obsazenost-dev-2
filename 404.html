  <!-- ============ PÍSMO GAMAY (Adobe Fonts) ============
       1) fonts.adobe.com → Gamay → „Add to Web Project“ (zaškrtni i Variable)
       2) ID projektu (např. abc1def) vlož níže do ADOBE_KIT
       Dokud je prázdné, použije se náhradní Archivo z Google Fonts. -->
  <script>
    (function () {
      var ADOBE_KIT = '';
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = ADOBE_KIT
        ? 'https://use.typekit.net/' + ADOBE_KIT + '.css'
        : 'https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Lobster&display=swap';
      document.head.appendChild(l);
      if (ADOBE_KIT) {
        var lob = document.createElement('link');
        lob.rel = 'stylesheet';
        lob.href = 'https://fonts.googleapis.com/css2?family=Lobster&display=swap';
        document.head.appendChild(lob);
      }
      document.documentElement.classList.add('js');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
